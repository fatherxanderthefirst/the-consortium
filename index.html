<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>The Consortium | House of Xander</title>

    <meta name="description"
          content="The Consortium. A private-house experience by House of Xander. Some experiences aren't for everybody.">

    <meta name="theme-color" content="#080707">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Sans:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

<style>

:root {
    --black: #070606;
    --black-soft: #0d0a0a;
    --black-card: #120d0e;

    --burgundy: #3a0d16;
    --burgundy-deep: #21070d;
    --burgundy-light: #591522;

    --gold: #c5a15a;
    --gold-light: #e1c27b;

    --cream: #eee8dc;
    --white: #f8f5ef;
    --muted: #9c9388;

    --line: rgba(197,161,90,0.18);
    --white-line: rgba(255,255,255,0.08);

    --serif: "Cormorant Garamond", serif;
    --sans: "DM Sans", sans-serif;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    background: var(--black);
    color: var(--cream);
    font-family: var(--sans);
    overflow-x: hidden;
}

a {
    color: inherit;
    text-decoration: none;
}

button,
input {
    font-family: inherit;
}

::selection {
    background: var(--gold);
    color: var(--black);
}


/* GRAIN */

body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 9999;
    opacity: 0.035;

    background-image:
        url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.7'/%3E%3C/svg%3E");
}


/* INTRO */

.intro {
    position: fixed;
    inset: 0;
    z-index: 10000;

    display: flex;
    align-items: center;
    justify-content: center;

    background:
        radial-gradient(
            circle at center,
            rgba(89,21,34,0.35),
            transparent 45%
        ),
        var(--black);

    transition:
        opacity 0.9s ease,
        visibility 0.9s ease;
}

.intro.hide {
    opacity: 0;
    visibility: hidden;
}

.intro-inner {
    width: min(90%, 700px);
    text-align: center;
}

.intro-small {
    color: var(--gold);
    font-size: 0.65rem;
    letter-spacing: 0.4em;
    text-transform: uppercase;
    margin-bottom: 25px;
}

.intro h1 {
    font-family: var(--serif);
    font-size: clamp(4rem, 13vw, 9rem);
    line-height: 0.8;
    font-weight: 500;
    letter-spacing: -0.04em;
}

.intro h1 span {
    color: var(--gold);
    font-style: italic;
}

.intro-line {
    width: 70px;
    height: 1px;
    background: var(--gold);
    margin: 35px auto;
}

.intro-tagline {
    color: var(--muted);
    font-size: 0.75rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    margin-bottom: 45px;
}

.enter-btn {
    background: transparent;
    border: 1px solid var(--gold);
    color: var(--gold-light);
    padding: 16px 30px;
    cursor: pointer;
    font-size: 0.7rem;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    transition: 0.3s ease;
}

.enter-btn:hover {
    background: var(--gold);
    color: var(--black);
}


/* HEADER */

.header {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    z-index: 1000;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 25px 5%;

    transition: 0.4s ease;
}

.header.scrolled {
    background: rgba(7,6,6,0.92);
    backdrop-filter: blur(15px);
    border-bottom: 1px solid var(--white-line);
    padding-top: 16px;
    padding-bottom: 16px;
}

.logo {
    font-family: var(--serif);
    font-size: 1.45rem;
    letter-spacing: 0.08em;
}

.logo span {
    color: var(--gold);
}

.nav {
    display: flex;
    gap: 30px;
}

.nav a {
    color: #c5bfb5;
    font-size: 0.63rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    transition: 0.3s;
}

.nav a:hover {
    color: var(--gold);
}

.menu {
    display: none;
    width: 32px;
    height: 22px;
    flex-direction: column;
    justify-content: space-between;
    cursor: pointer;
}

.menu span {
    display: block;
    width: 100%;
    height: 1px;
    background: var(--gold);
    transition: 0.3s;
}


/* HERO */

.hero {
    min-height: 100vh;
    position: relative;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 140px 7% 90px;

    overflow: hidden;

    background:
        radial-gradient(
            circle at 75% 45%,
            rgba(89,21,34,0.4),
            transparent 30%
        ),
        radial-gradient(
            circle at 15% 80%,
            rgba(58,13,22,0.25),
            transparent 30%
        ),
        var(--black);
}

.hero::after {
    content: "";
    position: absolute;
    width: 500px;
    height: 500px;
    right: -200px;
    bottom: -250px;
    border-radius: 50%;
    border: 1px solid rgba(197,161,90,0.12);
    box-shadow:
        0 0 0 80px rgba(197,161,90,0.025),
        0 0 0 160px rgba(197,161,90,0.018);
}

.hero-inner {
    width: min(1200px, 100%);
    position: relative;
    z-index: 2;
}

.confidential {
    display: flex;
    align-items: center;
    gap: 12px;

    color: var(--gold);
    font-size: 0.62rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;

    margin-bottom: 35px;
}

.confidential::before {
    content: "";
    width: 30px;
    height: 1px;
    background: var(--gold);
}

.hero h1 {
    max-width: 1000px;

    font-family: var(--serif);
    font-size: clamp(4rem, 10vw, 9rem);
    font-weight: 500;
    line-height: 0.78;
    letter-spacing: -0.045em;
}

.hero h1 em {
    color: var(--gold-light);
    font-weight: 400;
}

.hero-description {
    max-width: 540px;
    margin-top: 45px;

    color: var(--muted);
    font-size: 0.9rem;
    line-height: 1.9;
}

.hero-actions {
    display: flex;
    gap: 15px;
    margin-top: 40px;
    flex-wrap: wrap;
}

.gold-btn,
.outline-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;

    padding: 17px 27px;

    font-size: 0.65rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;

    transition: 0.3s ease;
}

.gold-btn {
    background: var(--gold);
    color: var(--black);
    border: 1px solid var(--gold);
}

.gold-btn:hover {
    background: var(--gold-light);
    transform: translateY(-3px);
}

.outline-btn {
    border: 1px solid var(--white-line);
    color: var(--cream);
}

.outline-btn:hover {
    border-color: var(--gold);
    color: var(--gold);
}

.hero-mark {
    position: absolute;
    right: 8%;
    bottom: 9%;

    width: 130px;
    height: 130px;

    border: 1px solid rgba(197,161,90,0.3);
    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: center;

    color: var(--gold);
    font-family: var(--serif);
    font-size: 3rem;

    opacity: 0.5;
}


/* GLOBAL */

.section {
    padding: 130px 7%;
    position: relative;
}

.section-inner {
    width: min(1200px, 100%);
    margin: auto;
}

.eyebrow {
    display: block;

    color: var(--gold);
    font-size: 0.62rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;

    margin-bottom: 20px;
}

.section-heading h2 {
    font-family: var(--serif);
    font-size: clamp(3rem, 7vw, 6.5rem);
    font-weight: 500;
    line-height: 0.85;
    letter-spacing: -0.035em;
}

.section-heading h2 em {
    color: var(--gold);
    font-weight: 400;
}


/* ABOUT */

.about {
    background:
        linear-gradient(
            120deg,
            var(--black-soft),
            var(--burgundy-deep)
        );
}

.about-grid {
    width: min(1200px, 100%);
    margin: auto;

    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 100px;
    align-items: end;
}

.about-text {
    margin-top: 50px;
    color: #aaa197;
    font-size: 1rem;
    line-height: 2;
}

.about-number {
    font-family: var(--serif);
    font-size: clamp(8rem, 18vw, 16rem);
    line-height: 0.65;
    color: rgba(197,161,90,0.1);
    text-align: right;
}

.about-caption {
    margin-top: 35px;
    color: var(--gold);
    font-size: 0.65rem;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    text-align: right;
}


/* EXPERIENCE */

.experience {
    background: var(--black);
}

.timeline {
    width: min(900px, 100%);
    margin: 90px auto 0;
}

.timeline-item {
    display: grid;
    grid-template-columns: 90px 1fr;
    gap: 30px;

    padding: 45px 0;

    border-top: 1px solid var(--white-line);
}

.timeline-number {
    color: var(--gold);
    font-family: var(--serif);
    font-size: 2rem;
}

.timeline-content span {
    color: var(--gold);
    font-size: 0.6rem;
    letter-spacing: 0.25em;
}

.timeline-content h3 {
    font-family: var(--serif);
    font-size: 2.5rem;
    font-weight: 500;
    margin: 8px 0 12px;
}

.timeline-content p {
    max-width: 600px;
    color: var(--muted);
    font-size: 0.85rem;
    line-height: 1.8;
}


/* HOUSES */

.houses {
    background:
        radial-gradient(
            circle at 50% 0,
            rgba(89,21,34,0.3),
            transparent 40%
        ),
        var(--black-soft);
}

.houses-grid {
    width: min(1200px, 100%);
    margin: 80px auto 0;

    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
}

.house-card {
    position: relative;
    min-height: 400px;

    padding: 35px;

    display: flex;
    flex-direction: column;
    justify-content: space-between;

    background:
        linear-gradient(
            145deg,
            rgba(89,21,34,0.45),
            rgba(18,13,14,0.95)
        );

    border: 1px solid var(--line);

    overflow: hidden;

    transition: 0.5s ease;
}

.house-card::before {
    content: "";
    position: absolute;
    width: 220px;
    height: 220px;
    top: -100px;
    right: -100px;

    border-radius: 50%;
    border: 1px solid rgba(197,161,90,0.15);
}

.house-card:hover {
    transform: translateY(-8px);
    border-color: rgba(197,161,90,0.5);
}

.house-number {
    color: rgba(197,161,90,0.6);
    font-family: var(--serif);
    font-size: 3rem;
}

.house-info span {
    color: var(--gold);
    font-size: 0.58rem;
    letter-spacing: 0.25em;
}

.house-info h3 {
    font-family: var(--serif);
    font-size: 2.5rem;
    font-weight: 500;
    margin: 7px 0 10px;
}

.house-info p {
    color: var(--muted);
    font-size: 0.78rem;
    line-height: 1.7;
}
  /* THE CODE */

.code {
    background: var(--black);
}

.code-layout {
    width: min(1200px, 100%);
    margin: auto;

    display: grid;
    grid-template-columns: 0.8fr 1.2fr;
    gap: 100px;
}

.code-intro {
    position: sticky;
    top: 130px;
    height: fit-content;
}

.code-intro p {
    margin-top: 35px;
    color: var(--muted);
    line-height: 1.8;
    font-size: 0.85rem;
}

.rules {
    border-top: 1px solid var(--white-line);
}

.rule {
    display: grid;
    grid-template-columns: 70px 1fr;
    gap: 20px;

    padding: 30px 0;

    border-bottom: 1px solid var(--white-line);
}

.rule-number {
    color: var(--gold);
    font-family: var(--serif);
    font-size: 1.5rem;
}

.rule p {
    color: var(--cream);
    font-family: var(--serif);
    font-size: 1.5rem;
    line-height: 1.25;
}


/* ACCESS */

.access {
    padding-top: 160px;
    padding-bottom: 160px;

    background:
        radial-gradient(
            circle at center,
            rgba(89,21,34,0.5),
            transparent 50%
        ),
        var(--burgundy-deep);
}

.access-box {
    width: min(800px, 100%);
    margin: auto;
    text-align: center;
}

.access-box h2 {
    font-family: var(--serif);
    font-size: clamp(4rem, 10vw, 8rem);
    font-weight: 500;
    line-height: 0.8;
}

.access-box h2 em {
    color: var(--gold);
}

.access-box > p {
    max-width: 500px;
    margin: 35px auto 55px;

    color: #aaa197;
    line-height: 1.8;
    font-size: 0.85rem;
}

.access-status {
    display: inline-block;

    margin-bottom: 45px;
    padding: 10px 17px;

    border: 1px solid var(--line);

    color: var(--gold);
    font-size: 0.58rem;
    letter-spacing: 0.25em;
    text-transform: uppercase;
}

.access-form {
    max-width: 600px;
    margin: auto;
    text-align: left;
}

.input-group {
    margin-bottom: 25px;
}

.input-group label {
    display: block;

    color: var(--gold);
    font-size: 0.58rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;

    margin-bottom: 10px;
}

.input-group input {
    width: 100%;

    padding: 17px 0;

    background: transparent;
    border: none;
    border-bottom: 1px solid rgba(255,255,255,0.2);

    outline: none;

    color: var(--cream);
    font-size: 0.9rem;

    transition: 0.3s;
}

.input-group input:focus {
    border-color: var(--gold);
}

.input-group input::placeholder {
    color: #68615b;
}

.submit-btn {
    width: 100%;
    margin-top: 15px;

    padding: 18px;

    border: 1px solid var(--gold);
    background: var(--gold);
    color: var(--black);

    cursor: pointer;

    font-size: 0.65rem;
    letter-spacing: 0.25em;
    text-transform: uppercase;

    transition: 0.3s;
}

.submit-btn:hover {
    background: var(--gold-light);
}

#formMessage {
    display: none;
    margin-top: 25px;

    color: var(--gold);
    font-size: 0.7rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
}

#formMessage.show {
    display: block;
}


/* FOOTER */

.footer {
    padding: 70px 7% 30px;
    background: #050404;
}

.footer-inner {
    width: min(1200px, 100%);
    margin: auto;
}

.footer-main {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;

    padding-bottom: 60px;
}

.footer-title {
    font-family: var(--serif);
    font-size: 3rem;
}

.footer-subtitle {
    margin-top: 5px;

    color: var(--gold);
    font-size: 0.6rem;
    letter-spacing: 0.25em;
}

.footer-brand {
    text-align: right;
}

.footer-brand span {
    display: block;

    color: var(--muted);
    font-size: 0.55rem;
    letter-spacing: 0.2em;
}

.footer-brand strong {
    display: block;

    margin-top: 6px;

    color: var(--gold);
    font-family: var(--serif);
    font-size: 1.3rem;
    font-weight: 500;
}

.footer-bottom {
    display: flex;
    justify-content: space-between;

    padding-top: 25px;

    border-top: 1px solid var(--white-line);

    color: #68615b;
    font-size: 0.55rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
}


/* SCROLL REVEAL */

.reveal {
    opacity: 0;
    transform: translateY(35px);

    transition:
        opacity 0.9s ease,
        transform 0.9s ease;
}

.reveal.visible {
    opacity: 1;
    transform: translateY(0);
}


/* MOBILE */

@media (max-width: 800px) {

    .header {
        padding: 20px 6%;
    }

    .nav {
        position: fixed;
        inset: 0;

        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;

        gap: 30px;

        background: rgba(7,6,6,0.98);

        opacity: 0;
        visibility: hidden;

        transition: 0.4s;
    }

    .nav.active {
        opacity: 1;
        visibility: visible;
    }

    .nav a {
        font-size: 0.8rem;
    }

    .menu {
        display: flex;
        position: relative;
        z-index: 1001;
    }

    .menu.active span:first-child {
        transform: translateY(10px) rotate(45deg);
    }

    .menu.active span:last-child {
        transform: translateY(-10px) rotate(-45deg);
    }

    .hero {
        min-height: 100svh;
        padding: 130px 6% 80px;
    }

    .hero h1 {
        font-size: clamp(4rem, 18vw, 7rem);
    }

    .hero-description {
        font-size: 0.82rem;
    }

    .hero-mark {
        display: none;
    }

    .section {
        padding: 90px 6%;
    }

    .about-grid,
    .code-layout {
        grid-template-columns: 1fr;
        gap: 50px;
    }

    .about-number {
        text-align: left;
        font-size: 9rem;
    }

    .about-caption {
        text-align: left;
    }

    .timeline {
        margin-top: 60px;
    }

    .timeline-item {
        grid-template-columns: 45px 1fr;
        gap: 15px;
        padding: 35px 0;
    }

    .timeline-content h3 {
        font-size: 2rem;
    }

    .houses-grid {
        grid-template-columns: 1fr;
        margin-top: 60px;
    }

    .house-card {
        min-height: 330px;
    }

    .code-intro {
        position: static;
    }

    .rule {
        grid-template-columns: 45px 1fr;
        gap: 10px;
    }

    .rule p {
        font-size: 1.25rem;
    }

    .access {
        padding-top: 110px;
        padding-bottom: 110px;
    }

    .footer-main {
        flex-direction: column;
        align-items: flex-start;
        gap: 35px;
    }

    .footer-brand {
        text-align: left;
    }

    .footer-bottom {
        flex-direction: column;
        gap: 10px;
    }

               }

<section class="section code" id="code">

    <div class="code-layout">


        <div class="code-intro reveal">

            <span class="eyebrow">
                The Code
            </span>

<script>

/* INTRO */

const intro = document.getElementById("intro");
const enterButton = document.getElementById("enterButton");

enterButton.addEventListener("click", () => {

    intro.classList.add("hide");

});


/* HEADER */

const header = document.getElementById("header");

window.addEventListener("scroll", () => {

    if (window.scrollY > 40) {

        header.classList.add("scrolled");

    } else {

        header.classList.remove("scrolled");

    }

});


/* MOBILE MENU */

const menuButton = document.getElementById("menuButton");
const nav = document.getElementById("nav");

menuButton.addEventListener("click", () => {

    menuButton.classList.toggle("active");
    nav.classList.toggle("active");

});


/* CLOSE MOBILE MENU */

document.querySelectorAll(".nav a").forEach(link => {

    link.addEventListener("click", () => {

        menuButton.classList.remove("active");
        nav.classList.remove("active");

    });

});


/* SCROLL REVEAL */

const revealElements =
    document.querySelectorAll(".reveal");

const revealObserver =
    new IntersectionObserver(
        (entries) => {

            entries.forEach(entry => {

                if (entry.isIntersecting) {

                    entry.target.classList.add("visible");

                    revealObserver.unobserve(entry.target);

                }

            });

        },
        {
            threshold: 0.12
        }
    );


revealElements.forEach(element => {

    revealObserver.observe(element);

});


/* ACCESS FORM */

const accessForm =
    document.getElementById("accessForm");

const formMessage =
    document.getElementById("formMessage");

accessForm.addEventListener("submit", (event) => {

    event.preventDefault();

    const name =
        document.getElementById("name").value.trim();

    if (!name) return;

    formMessage.textContent =
        `REQUEST RECEIVED, ${name.toUpperCase()}. THE HOUSE WILL BE IN TOUCH.`;

    formMessage.classList.add("show");

    accessForm
        .querySelector(".submit-btn")
        .textContent = "REQUEST RECEIVED";

});


</script>
